<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070f">
<title>fractalSwing</title>
<meta name="description" content="fractalSwing — an interactive fractal animation generator. Eleven fractal families, every parameter on a live-adjustable swing, audio-reactive. Web version of the Android app.">
<style>
:root{--accent:#7cf2ff;--accent2:#ff5cc8;--text:#f2f2fa;--dim:#a0a0b8;--bg:#07070f;--sheet:rgba(11,11,22,.9);--card:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#fab{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:22px;font-weight:700;cursor:pointer;z-index:5;backdrop-filter:blur(6px)}
#hint{position:fixed;top:calc(68px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:92vw;background:rgba(0,0,0,.6);color:rgba(255,255,255,.85);padding:8px 14px;border-radius:12px;font-size:13px;text-align:center;z-index:5;transition:opacity .4s;pointer-events:none}
#hint.hidden{opacity:0}
#nogl{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);z-index:9;line-height:1.5}
#panel{position:fixed;left:0;right:0;bottom:0;height:46vh;max-height:620px;background:var(--sheet);backdrop-filter:blur(10px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;z-index:6;padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.5);transform:translateY(0);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#panel.hidden{transform:translateY(110%)}
@media (orientation:landscape) and (max-height:520px){#panel{height:62vh}}
@media (min-width:900px){#panel{left:auto;right:16px;bottom:16px;width:420px;height:min(76vh,760px);border-radius:18px}#panel.hidden{transform:translateX(130%)}}
.head{display:flex;align-items:center;gap:4px}
.head .title{flex:1;min-width:0}
.head .title b{color:var(--accent);font-size:15px;font-family:"Segoe UI Semibold","Roboto Condensed",system-ui,sans-serif}
.head .title div{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;color:var(--text);font-size:18px;padding:4px 10px;cursor:pointer;border-radius:8px}
.ib:hover{background:var(--card)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--dim);font-weight:700;font-size:12px;padding:8px 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--accent);background:rgba(124,242,255,.16)}
.content{flex:1;overflow-y:auto;padding:4px 0 24px;scrollbar-width:thin}
.row{padding:4px}
.row .top{display:flex;font-size:13px}
.row .top span:first-child{flex:1}
.row .top .val{color:var(--accent)}
.row .help{color:var(--dim);font-size:10.5px;margin:0 2px 2px}
input[type=range]{width:100%;margin:6px 0 2px;accent-color:var(--accent);height:22px}
.choice{display:flex;align-items:center;padding:6px 4px;font-size:14px;gap:8px}
.choice span{flex:1}
select{background:#14141f;color:var(--text);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 8px;font-size:13px;max-width:60%}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;font-size:14px;cursor:pointer}
.sw{position:relative;width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,.18);transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on .sw{background:var(--accent)}
.toggle.on .sw::after{left:21px}
.sec{color:var(--accent2);font-size:12px;font-weight:700;padding:12px 4px 4px}
.note{color:var(--dim);font-size:11.5px;padding:2px 4px 6px;line-height:1.4}
.btnrow{display:flex;gap:6px;padding:3px 2px}
.btn{flex:1;background:var(--card);color:var(--text);border:1px solid rgba(124,242,255,.5);border-radius:10px;padding:9px 10px;font-size:13px;cursor:pointer;text-align:center;text-decoration:none}
.btn.pink{border-color:rgba(255,92,200,.6)}
.btn:hover{background:rgba(255,255,255,.14)}
.card{background:var(--card);border-radius:12px;padding:6px 10px;margin:3px 0}
.card.dim{background:rgba(255,255,255,.04)}
.card .chead{display:flex;align-items:center;gap:6px;cursor:pointer;min-height:30px}
.card .chead b{flex:1;font-size:14px}
.card .chead .ro{color:var(--accent);font-size:11.5px;text-align:right}
.card .chead .sw{margin-left:4px}
.status{font-size:11.5px;color:var(--dim);padding:0 4px 8px}
a{color:var(--accent)}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="nogl"><div><b>fractalSwing needs WebGL2.</b><br>Your browser didn't give us a WebGL2 context. Try Chrome, Firefox, Edge or Safari 15+, or grab the Android APK from the repo.</div></div>
<button id="fab" title="Controls (H)">≡</button>
<div id="hint" class="hidden"></div>
<div id="panel">
  <div class="head">
    <div class="title"><b>fractalSwing</b><div id="status">…</div></div>
    <button class="ib" id="bSnap" title="Snapshot (S)">📷</button>
    <button class="ib" id="bRand" title="Randomize (R)">🎲</button>
    <button class="ib" id="bFull" title="Fullscreen (F)">⛶</button>
    <button class="ib" id="bHide" title="Hide (H)">✕</button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
</div>
<script>
"use strict";
// ============================================================ shaders (identical to the Android app's assets)
const VERT_SRC = `#version 300 es
// fractalSwing — fullscreen triangle. No vertex buffer: bind an empty VAO and
//   glDrawArrays(GL_TRIANGLES, 0, 3)
// vNdc: -1..1 across the viewport (x right, y up). vUv: 0..1.

out vec2 vNdc;
out vec2 vUv;

void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2)) * 2.0 - 1.0;
    vNdc = p;
    vUv = p * 0.5 + 0.5;
    gl_Position = vec4(p, 0.0, 1.0);
}`;
const FRACTAL_SRC = `#version 300 es
// fractalSwing — the fractal pass. One program per family (FRACTAL is a compile-time define),
// rendered into the render-scale FBO. Everything that "swings" arrives as a uniform.
//
//   FRACTAL 0  Quadratic   z = z^2 + c
//           1  Burning Ship z = (|re z| + i|im z|)^2 + c
//           2  Tricorn     z = conj(z)^2 + c
//           3  Multibrot   z = z^power + c
//           4  Phoenix     z' = z^2 + re c + im c * z_prev
//           5  Celtic      z = (|re z^2|, im z^2) + c
//           6  Ducks       z = log(re z + i|im z|) + c          (orbit-average colouring)
//           7  Kali        z = |z| / |z|^2 + c                  (orbit-average colouring)
//           8  Newton      z -= relax * (z^3 + c z - 1) / (3 z^2 + c)
//           9  Box Fold    2D Mandelbox: box fold, sphere fold, z = fold * z + c
//          10  Sine        z = c * sin(z)
//
// uJulia = 1: z0 = pixel, c = uC (Julia form).  uJulia = 0: z0 = uC, c = pixel (Mandelbrot form).

precision highp float;
precision highp int;

in vec2 vNdc;
in vec2 vUv;
out vec4 fragColor;

uniform vec2 uRes;
uniform float uTime;
uniform vec2 uCenter;
uniform float uScale;       // half-height of the view in fractal units
uniform float uRot;
uniform vec2 uC;
uniform float uPower;
uniform float uFold;
uniform float uExtra;
uniform int uIters;
uniform float uBailout;
uniform int uJulia;
uniform int uKaleido;
uniform float uKaleidoRot;
uniform int uMirror;

uniform int uColorMode;     // 0 smooth iteration, 1 orbit trap, 2 stripes, 3 angle
uniform int uTrapType;      // 0 point, 1 cross, 2 ring
uniform vec2 uTrap;
uniform float uTrapMix;
uniform float uStripe;
uniform vec3 uPalA;
uniform vec3 uPalB;
uniform vec3 uPalC;
uniform vec3 uPalD;
uniform float uColorOffset;
uniform float uColorDensity;
uniform float uSat;
uniform float uBright;
uniform float uContrast;
uniform float uGamma;
uniform float uBands;
uniform float uInvert;
uniform int uInsideMode;    // 0 solid, 1 trap, 2 stripes
uniform vec3 uInsideColor;
uniform float uFade;        // 0..1: darken the far exterior (few iterations) so the structure glows

#ifndef FRACTAL
#define FRACTAL 0
#endif

const float PI = 3.14159265359;

vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cdiv(vec2 a, vec2 b) {
    float d = max(dot(b, b), 1e-20);
    return vec2(a.x * b.x + a.y * b.y, a.y * b.x - a.x * b.y) / d;
}
vec2 cpow(vec2 z, float p) {
    float r = length(z);
    if (r < 1e-12) return vec2(0.0);
    float th = atan(z.y, z.x);
    float rp = pow(r, p);
    return rp * vec2(cos(p * th), sin(p * th));
}
vec2 clog(vec2 z) { return vec2(log(max(length(z), 1e-20)), atan(z.y, z.x)); }
vec2 csin(vec2 z) { return vec2(sin(z.x) * cosh(z.y), cos(z.x) * sinh(z.y)); }

vec3 palette(float t) { return uPalA + uPalB * cos(2.0 * PI * (uPalC * t + uPalD)); }

float trapDist(vec2 z) {
    if (uTrapType == 0) return length(z - uTrap);
    if (uTrapType == 1) return min(abs(z.x - uTrap.x), abs(z.y - uTrap.y));
    return abs(length(z - uTrap) - 0.5);
}

void main() {
    // view-space coordinates: aspect-correct, y up, screen centre at 0
    vec2 q = vNdc * vec2(uRes.x / uRes.y, 1.0);
    if ((uMirror & 1) != 0) q.x = abs(q.x);
    if ((uMirror & 2) != 0) q.y = abs(q.y);
    if (uKaleido > 1) {
        float seg = 2.0 * PI / float(uKaleido);
        float a = atan(q.y, q.x) + uKaleidoRot;
        a = mod(a, seg);
        a = abs(a - seg * 0.5);
        q = length(q) * vec2(cos(a), sin(a));
    }
    float cr = cos(uRot);
    float sr = sin(uRot);
    q = vec2(q.x * cr - q.y * sr, q.x * sr + q.y * cr) * uScale + uCenter;

    vec2 z;
    vec2 c;
    if (uJulia == 1) { z = q; c = uC; } else { z = uC; c = q; }

    float trapMin = 1e9;
    float stripeAcc = 0.0;
    float orbitAcc = 0.0;
    vec2 zp = vec2(0.0);
    vec2 f = vec2(1.0);
    int n = uIters;
    int i = 0;
    bool escaped = false;
    float b2 = uBailout * uBailout;

    for (i = 0; i < n; i++) {
#if FRACTAL == 0
        z = cmul(z, z) + c;
#elif FRACTAL == 1
        z = abs(z);
        z = cmul(z, z) + c;
#elif FRACTAL == 2
        z = vec2(z.x, -z.y);
        z = cmul(z, z) + c;
#elif FRACTAL == 3
        z = cpow(z, uPower) + c;
#elif FRACTAL == 4
        vec2 zn = cmul(z, z) + vec2(c.x, 0.0) + c.y * zp;
        zp = z;
        z = zn;
#elif FRACTAL == 5
        vec2 z2 = cmul(z, z);
        z = vec2(abs(z2.x), z2.y) + c;
#elif FRACTAL == 6
        z = clog(vec2(z.x, abs(z.y))) + c;
#elif FRACTAL == 7
        z = abs(z) / max(dot(z, z), 1e-12) + c;
#elif FRACTAL == 8
        vec2 z2 = cmul(z, z);
        f = cmul(z2, z) + cmul(uC, z) - vec2(1.0, 0.0);
        vec2 df = 3.0 * z2 + uC;
        z = z - uExtra * cdiv(f, df);
#elif FRACTAL == 9
        z = clamp(z, -1.0, 1.0) * 2.0 - z;
        float r2b = dot(z, z);
        float mr = max(uExtra * uExtra, 1e-4);
        if (r2b < mr) z *= 1.0 / mr;
        else if (r2b < 1.0) z /= r2b;
        z = uFold * z + c;
#elif FRACTAL == 10
        z = cmul(c, csin(z));
#endif
        float m2 = dot(z, z);
        trapMin = min(trapMin, trapDist(z));
        stripeAcc += 0.5 + 0.5 * sin(uStripe * atan(z.y, z.x));
#if FRACTAL == 6 || FRACTAL == 7
        orbitAcc += log(1.0 + m2);
#elif FRACTAL == 8
        if (dot(f, f) < 1e-14) { escaped = true; break; }
#elif FRACTAL == 10
        if (abs(z.y) > uBailout) { escaped = true; break; }
#else
        if (m2 > b2) { escaped = true; break; }
#endif
    }

    bool inside;
    float smoothIter;
#if FRACTAL == 6 || FRACTAL == 7
    inside = false;
    smoothIter = 6.0 * orbitAcc / float(max(n, 1));
#elif FRACTAL == 8
    inside = !escaped;
    if (escaped) {
        float lf = log(max(length(f), 1e-30));
        smoothIter = float(i) + 1.0 - log(max(log(1e-7) / min(lf, -1e-6), 1e-6)) / log(2.0);
    } else smoothIter = float(n);
#else
    inside = !escaped;
    if (escaped) {
#if FRACTAL == 3
        float pw = max(uPower, 1.05);
#elif FRACTAL == 9
        float pw = max(abs(uFold), 1.05);
#elif FRACTAL == 10
        float pw = 2.718;
#else
        float pw = 2.0;
#endif
        float lz = 0.5 * log(max(dot(z, z), 1.0001));
        float lb = log(max(uBailout, 1.0001));
        smoothIter = float(i) + 1.0 - log(max(lz / lb, 1e-6)) / log(pw);
    } else smoothIter = float(n);
#endif

    float v;
    if (uColorMode == 0) v = sqrt(max(smoothIter, 0.0)) * 0.18;
    else if (uColorMode == 1) v = trapMin;
    else if (uColorMode == 2) v = stripeAcc / float(max(i, 1));
    else v = atan(z.y, z.x) / (2.0 * PI) + 0.5;
    if (uTrapMix > 0.0 && uColorMode != 1) v = mix(v, trapMin, uTrapMix);

    vec3 col = palette(v * uColorDensity + uColorOffset);
    if (inside) {
        if (uInsideMode == 0) col = uInsideColor;
        else if (uInsideMode == 1) col = palette(trapMin * uColorDensity + uColorOffset) * uInsideColor;
        else col = palette(stripeAcc / float(max(n, 1)) * uColorDensity + uColorOffset) * uInsideColor;
    }

#if FRACTAL != 6 && FRACTAL != 7
    if (!inside) col *= mix(1.0, smoothstep(0.0, 10.0, smoothIter), uFade);
#endif

    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    col = mix(vec3(lum), col, uSat);
    col = (col - 0.5) * uContrast + 0.5;
    col *= uBright;
    if (uBands > 0.5) col = floor(col * uBands + 0.5) / uBands;
    col = mix(col, 1.0 - col, uInvert);
    col = pow(max(col, vec3(0.0)), vec3(1.0 / max(uGamma, 0.05)));
    fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
const POST_SRC = `#version 300 es
// fractalSwing — post pass: glow and video feedback. Reads this frame's fractal (uFrac) and the
// previous post output (uPrev), writes the new post output. Uses fullscreen.vert.
precision highp float;

in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uFrac;
uniform sampler2D uPrev;
uniform vec2 uRes;
uniform int uFbMode;        // 0 off, 1 trails (max), 2 screen, 3 echo (mix)
uniform float uFbDecay;
uniform float uFbZoom;
uniform float uFbRot;
uniform vec2 uFbShift;
uniform float uFbHue;
uniform float uGlow;
uniform float uGlowRadius;  // pixels
uniform float uFlash;

const float PI = 3.14159265359;

vec3 hueRotate(vec3 c, float h) {
    if (abs(h) < 1e-5) return c;
    const vec3 k = vec3(0.57735027);
    float a = 2.0 * PI * h;
    float ca = cos(a);
    float sa = sin(a);
    return c * ca + cross(k, c) * sa + k * dot(k, c) * (1.0 - ca);
}

void main() {
    vec3 col = texture(uFrac, vUv).rgb;

    if (uGlow > 0.001) {
        vec2 px = uGlowRadius / uRes;
        vec3 g = vec3(0.0);
        g += texture(uFrac, vUv + vec2(px.x, 0.0)).rgb;
        g += texture(uFrac, vUv - vec2(px.x, 0.0)).rgb;
        g += texture(uFrac, vUv + vec2(0.0, px.y)).rgb;
        g += texture(uFrac, vUv - vec2(0.0, px.y)).rgb;
        g += texture(uFrac, vUv + px * 0.7071).rgb;
        g += texture(uFrac, vUv - px * 0.7071).rgb;
        g += texture(uFrac, vUv + vec2(px.x, -px.y) * 0.7071).rgb;
        g += texture(uFrac, vUv + vec2(-px.x, px.y) * 0.7071).rgb;
        g += texture(uFrac, vUv + vec2(px.x, 0.0) * 2.0).rgb;
        g += texture(uFrac, vUv - vec2(px.x, 0.0) * 2.0).rgb;
        g += texture(uFrac, vUv + vec2(0.0, px.y) * 2.0).rgb;
        g += texture(uFrac, vUv - vec2(0.0, px.y) * 2.0).rgb;
        g /= 12.0;
        // bright pass: only what's already bright blooms, so a bright far field doesn't wash out
        vec3 b = max(g - vec3(0.35), vec3(0.0));
        col += b * b * uGlow * 2.2;
    }

    if (uFbMode != 0) {
        float asp = uRes.x / uRes.y;
        vec2 d = (vUv - 0.5) * vec2(asp, 1.0);
        float cr = cos(uFbRot);
        float sr = sin(uFbRot);
        d = vec2(d.x * cr - d.y * sr, d.x * sr + d.y * cr) * (1.0 - uFbZoom);
        vec2 puv = d / vec2(asp, 1.0) + 0.5 + uFbShift;
        vec3 prev = texture(uPrev, puv).rgb;
        if (puv.x < 0.0 || puv.x > 1.0 || puv.y < 0.0 || puv.y > 1.0) prev = vec3(0.0);
        prev = hueRotate(prev, uFbHue);
        if (uFbMode == 1) col = max(col, prev * uFbDecay);
        else if (uFbMode == 2) col = 1.0 - (1.0 - col) * (1.0 - prev * uFbDecay);
        else col = mix(col, prev, uFbDecay);
    }

    col += vec3(uFlash);
    // soft clip: scale an over-bright colour down instead of clipping it to white
    float mx = max(col.r, max(col.g, col.b));
    if (mx > 1.0) col /= mx;
    fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
const BLIT_SRC = `#version 300 es
// fractalSwing — final pass to the screen: chromatic aberration, vignette, scanlines, grain, dither.
precision highp float;

in vec2 vUv;
out vec4 fragColor;

uniform sampler2D uTex;
uniform vec2 uRes;
uniform float uTime;
uniform float uCa;
uniform float uVignette;
uniform float uGrain;
uniform float uScan;

void main() {
    vec2 uv = vUv;
    vec2 d = uv - 0.5;
    float r2 = dot(d, d);
    vec3 col;
    if (uCa > 0.001) {
        vec2 off = d * (r2 * 2.0 + 0.15) * uCa * 0.06;
        col.r = texture(uTex, uv + off).r;
        col.g = texture(uTex, uv).g;
        col.b = texture(uTex, uv - off).b;
    } else {
        col = texture(uTex, uv).rgb;
    }
    col *= 1.0 - uVignette * smoothstep(0.15, 0.6, r2);
    if (uScan > 0.001) col *= 1.0 - uScan * 0.35 * (0.5 + 0.5 * sin(gl_FragCoord.y * 3.14159));
    float n = fract(52.9829189 * fract(dot(gl_FragCoord.xy + fract(uTime * 7.0) * 100.0, vec2(0.06711056, 0.00583715))));
    col += (n - 0.5) * (uGrain * 0.18 + 1.0 / 255.0);
    fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;
const APK_URL = "../1.0.0/fractalSwing-v1.0.0.apk";
const APK_LABEL = "APK v1.0.0 · Android 8+";
const DOCS_URL = "https://github.com/timmseth/homebrewgames/blob/main/Android/fractalSwing/README.md";

// ============================================================ model
const FAMILIES = ["Quadratic","Burning Ship","Tricorn","Multibrot","Phoenix","Celtic","Ducks","Kali","Newton","Box Fold","Sine"];
const MODES = ["Julia","Mandelbrot"];
const COLOR_MODES = ["Smooth iteration","Orbit trap","Stripes","Angle"];
const TRAP_TYPES = ["Point","Cross","Ring"];
const INSIDE_MODES = ["Solid","Trap tint","Stripe tint"];
const FB_MODES = ["Off","Trails","Screen","Echo"];
const QUALITY = ["Auto","Low (0.35)","Medium (0.5)","High (0.7)","Full (1.0)"];
const KALEIDO = ["Off","2","3","4","5","6","7","8","10","12","16"];
const KALEIDO_N = [0,2,3,4,5,6,7,8,10,12,16];

function hash(i){ const s = Math.sin(i*12.9898+78.233)*43758.5453; return s-Math.floor(s); }
function waveAt(w, x){
  const f = x-Math.floor(x);
  switch(w){
    case 0: return Math.sin(2*Math.PI*x);
    case 1: return 1-4*Math.abs(f-.5);
    case 2: return 2*f-1;
    case 3: return Math.tanh(6*Math.sin(2*Math.PI*x));
    case 4: { const s=Math.sin(2*Math.PI*x); return Math.sign(s)*Math.pow(Math.abs(s),.55); }
    case 5: return Math.abs(Math.sin(Math.PI*x))*2-1;
    case 6: { const i=Math.floor(x), a=hash(i), b=hash(i+1), t=f*f*(3-2*f); return (a+(b-a)*t)*2-1; }
    default: return hash(Math.floor(x*4))*2-1;
  }
}

class Swing {
  constructor(id,label,min,max,defCenter,defAmp=0,defPeriod=20,wrap=false,unit=""){
    Object.assign(this,{id,label,min,max,defCenter,defAmp,defPeriod,wrap,unit});
    this.drift=0; this.value=defCenter; this.reset();
  }
  reset(){ this.on=true; this.center=this.defCenter; this.amp=this.defAmp; this.period=this.defPeriod; this.wave=0; this.phase=0; this.audio=0; this.audioAmt=0; this.drift=0; }
  eval(t, sig, master){
    let v = this.center + this.drift;
    if (this.on && this.amp !== 0) v += this.amp*master*waveAt(this.wave, t/Math.max(this.period,.05)+this.phase);
    if (this.audio) v += this.audioAmt*sig[this.audio];
    if (this.wrap){ const span=this.max-this.min; let r=(v-this.min)%span; if(r<0) r+=span; v=this.min+r; } else v=clamp(v,this.min,this.max);
    this.value=v; return v;
  }
  toJson(){ return {on:this.on,c:this.center,a:this.amp,p:this.period,w:WAVES[this.wave],ph:this.phase,au:this.audio,aa:this.audioAmt}; }
  fromJson(o){
    this.on = o.on!==undefined ? !!o.on : true;
    this.center = +(o.c ?? this.defCenter); this.amp = +(o.a ?? this.defAmp);
    this.period = clamp(+(o.p ?? this.defPeriod), .1, 600);
    const wi = WAVES.indexOf(o.w); this.wave = wi>=0 ? wi : 0;
    this.phase = +(o.ph ?? 0); this.audio = clamp(Math.round(+(o.au ?? 0)),0,5); this.audioAmt = +(o.aa ?? 0);
  }
}

    this.spin=chance(.3)?rf(-6,6):0; this.paused=false;
  }
  mutate(strength=.12){
    const rf=(a,b)=>a+Math.random()*(b-a), chance=p=>Math.random()<p;

}

    this.cur=1-this.cur;
    if(this.shotCb){ const cb=this.shotCb; this.shotCb=null; try{ this.canvas.toBlob(b=>cb(b),"image/png"); }catch(e){ cb(null); } }
    // pacing
    const ms=dt*1000; this.frameEma=this.frameEma*.9+ms*.1; this.fps=1000/Math.max(this.frameEma,1);
    // display cadence: the shortest recent interval; a 30 Hz-capped surface must not read as "GPU too slow"
    if(ms>4&&ms<this.refresh) this.refresh=ms;
    if(now-this.refreshSince>3){ this.refreshSince=now; this.refresh=Math.min(this.refresh*1.15,40); }
    const slowThresh=Math.max(24,this.refresh*1.5);
    const fast=this.frameEma<12||(this.refresh<18&&this.frameEma<this.refresh*1.1&&this.scale<.7);
    const fixed=p.renderScaleFor();
    if(fixed>0){ if(Math.abs(fixed-this.scale)>.01&&now-this.lastScaleChange>.5){ this.lastScaleChange=now; this.setScale(fixed); } }
    else if(now-this.lastScaleChange>1.5){
      if(this.frameEma>slowThresh){ if(this.slowSince<0) this.slowSince=now; if(now-this.slowSince>1.2&&this.scale>.3){ this.lastScaleChange=now; this.slowSince=-1; this.fastSince=-1; this.setScale(Math.max(.3,this.scale-.1)); } } else this.slowSince=-1;
      if(fast){ if(this.fastSince<0) this.fastSince=now; if(now-this.fastSince>4&&this.scale<.9){ this.lastScaleChange=now; this.fastSince=-1; this.slowSince=-1; this.setScale(Math.min(1,this.scale+.1)); } } else this.fastSince=-1;
    }
  }
}

// ============================================================ panel
const TABS=["FRACTAL","SWINGS","COLOUR","FX","AUDIO","PRESETS"];
class Panel {
  constructor(params, host){
    this.p=params; this.host=host; this.tab=0; this.refreshers=[]; this.readouts=[]; this.expanded=new Set(["cx"]); this.suppress=false;
    this.el=document.getElementById("panel"); this.tabsEl=document.getElementById("tabs"); this.contentEl=document.getElementById("content"); this.statusEl=document.getElementById("status");
    TABS.forEach((t,i)=>{ const b=document.createElement("button"); b.className="tab"; b.textContent=t; b.onclick=()=>{ this.tab=i; this.rebuild(); }; this.tabsEl.appendChild(b); });
    this.rebuild();
  }
  get visible(){ return !this.el.classList.contains("hidden"); }
  show(v){ this.el.classList.toggle("hidden",!v); if(v){ this.refresh(); this.tick(); } localStorage.setItem("fs.panel",v?"1":"0"); }
  refresh(){ this.suppress=true; for(const r of this.refreshers) r(); this.suppress=false; }
  tick(){ this.statusEl.textContent=this.host.statusLine(); for(const r of this.readouts) r(); }
  rebuild(){
    this.refreshers=[]; this.readouts=[];
    [...this.tabsEl.children].forEach((b,i)=>b.classList.toggle("on",i===this.tab));
    const c=this.contentEl; c.innerHTML="";
    const p=this.p;
    switch(this.tab){
      case 0: for(const pr of p.fractalProps) c.appendChild(this.propView(pr)); break;
      case 1: this.buildSwings(c); break;
      case 2: for(const pr of p.colorProps) c.appendChild(this.propView(pr)); break;
      case 3: for(const pr of p.fxProps) c.appendChild(this.propView(pr)); break;
      case 4: this.buildAudio(c); break;
      default: this.buildPresets(c);
    }
    this.tick();
  }
  el_(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
  propView(pr){ return pr.kind==="toggle"?this.toggleRow(pr):pr.kind==="choice"?this.choiceRow(pr):this.sliderRow(pr); }
  toggleRow(pr){
    const row=this.el_("div","toggle"); row.appendChild(this.el_("span",null,pr.label)); row.appendChild(this.el_("span","sw"));
    const set=()=>row.classList.toggle("on",pr.get()>.5); set();
    row.onclick=()=>{ pr.set(pr.get()>.5?0:1); set(); this.host.onChange(pr); };
    this.refreshers.push(set); return row;
  }
  choiceRow(pr){
    const row=this.el_("div","choice"); row.appendChild(this.el_("span",null,pr.label));
    const sel=document.createElement("select"); pr.options.forEach((o,i)=>{ const op=document.createElement("option"); op.value=i; op.textContent=o; sel.appendChild(op); });
    sel.value=Math.round(pr.get()); sel.onchange=()=>{ if(!this.suppress){ pr.set(+sel.value); this.onStructural(pr); } };
    row.appendChild(sel); this.refreshers.push(()=>{ sel.value=Math.round(pr.get()); }); return row;
  }
  onStructural(pr){ if(this.tab===1) this.rebuild(); this.host.onChange(pr); if(pr.key==="family"||pr.key==="julia") this.host.afterPreset(); }
  sliderRow(pr){
    const box=this.el_("div","row"), top=this.el_("div","top"), lab=this.el_("span",null,pr.label), val=this.el_("span","val");
    top.appendChild(lab); top.appendChild(val); box.appendChild(top);
    const steps=1000, inp=document.createElement("input"); inp.type="range"; inp.min=0; inp.max=steps; inp.step=1;
    const toBar=v=> pr.log&&pr.min>0 ? Math.round(Math.log(v/pr.min)/Math.log(pr.max/pr.min)*steps) : Math.round((v-pr.min)/(pr.max-pr.min)*steps);
    const fromBar=b=>{ const t=b/steps; let v= pr.log&&pr.min>0 ? pr.min*Math.pow(pr.max/pr.min,t) : pr.min+(pr.max-pr.min)*t; if(pr.kind==="int") v=Math.round(v); return v; };
    const show=()=>{ val.textContent= pr.kind==="int"?String(Math.round(pr.get())):pr.fmt(pr.get()); };
    inp.value=clamp(toBar(pr.get()),0,steps); show();
    inp.oninput=()=>{ if(!this.suppress){ pr.set(fromBar(+inp.value)); show(); this.host.onChange(pr); } };
    box.appendChild(inp);
    if(pr.help){ box.appendChild(this.el_("div","help",pr.help)); }
    this.refreshers.push(()=>{ inp.value=clamp(toBar(pr.get()),0,steps); show(); });
    return box;
  }
  btn(text,onClick,pink=false){ const b=this.el_("button","btn"+(pink?" pink":""),text); b.onclick=onClick; return b; }
  btnRow(...bs){ const r=this.el_("div","btnrow"); bs.forEach(b=>r.appendChild(b)); return r; }
  buildSwings(c){
    const p=this.p;
    c.appendChild(this.el_("div","note","Every parameter below oscillates on its own: centre ± amplitude over a period, with a shape, a phase, and optionally an audio signal added on top. Tap a card to open it."));
    c.appendChild(this.btnRow(this.btn("Open all",()=>{ p.swings.forEach(s=>this.expanded.add(s.id)); this.rebuild(); }), this.btn("Close all",()=>{ this.expanded.clear(); this.rebuild(); }), this.btn("Reset swings",()=>{ p.swings.forEach(s=>s.reset()); p.resetView(); this.rebuild(); })));
    const rel=p.swings.filter(s=>p.swingRelevant(s)), oth=p.swings.filter(s=>!p.swingRelevant(s));
    for(const s of rel) c.appendChild(this.swingCard(s,true));
    if(oth.length){ c.appendChild(this.el_("div","sec","Not used by the current fractal / colour settings")); for(const s of oth) c.appendChild(this.swingCard(s,false)); }
  }
  swingCard(s,relevant){
    const card=this.el_("div","card"+(relevant?"":" dim")), head=this.el_("div","chead"), name=this.el_("b",null,s.label), ro=this.el_("span","ro"), sw=this.el_("span","sw");
    if(!relevant) name.style.color="var(--dim)";
    head.appendChild(name); head.appendChild(ro); head.appendChild(sw); card.appendChild(head);
    const setSw=()=>head.classList.toggle("on",s.on); setSw(); head.classList.add("toggle"); head.style.padding="0";
    sw.onclick=e=>{ e.stopPropagation(); s.on=!s.on; setSw(); };
    head.onclick=()=>{ if(this.expanded.has(s.id)) this.expanded.delete(s.id); else this.expanded.add(s.id); this.rebuild(); };
    if(this.expanded.has(s.id)){ const body=this.el_("div"); for(const pr of this.p.swingProps(s)) if(pr.key!==s.id+".on") body.appendChild(this.propView(pr)); card.appendChild(body); }
    this.readouts.push(()=>{ ro.textContent=fmt(s.value)+s.unit+"  ("+WAVE_LABELS[s.wave].toLowerCase()+" "+s.center.toFixed(2)+" ± "+s.amp.toFixed(2)+" / "+s.period.toFixed(0)+"s)"; });
    this.refreshers.push(setSw);
    return card;
  }
  buildAudio(c){
    const p=this.p, host=this.host;
    c.appendChild(this.el_("div","note","React to music. The browser can't hear what the phone or PC is playing on its own, so pick a source: the microphone (works everywhere), or on desktop Chrome/Edge, the audio of another tab — choose the tab playing music and tick \"Share tab audio\"."));
    c.appendChild(this.btnRow(this.btn("🎤 Microphone",()=>host.startAudio("mic")), this.btn("🖥 Tab audio",()=>host.startAudio("tab")), this.btn("Stop",()=>host.stopAudio(),true)));
    const st=this.el_("div","status"); this.readouts.push(()=>{ st.textContent=host.audioStatus(); }); c.appendChild(st);
    c.appendChild(this.el_("div","note","Global mappings below; any swing can also follow a signal — open a swing and set its Audio link."));
    for(const pr of p.audioProps) c.appendChild(this.propView(pr));
  }
  buildPresets(c){
    const p=this.p, host=this.host;
    c.appendChild(this.el_("div","sec","Built-in looks"));
    for(let i=0;i<PRESETS.length;i+=2){
      const mk=j=>this.btn(PRESETS[j].name,()=>{ applyPreset(j,p); host.afterPreset(); this.refresh(); host.hint(PRESETS[j].blurb,3000); });
      c.appendChild(i+1<PRESETS.length?this.btnRow(mk(i),mk(i+1)):this.btnRow(mk(i)));
    }
    c.appendChild(this.el_("div","sec","Generate"));
    c.appendChild(this.btnRow(this.btn("Randomize",()=>{ p.randomize(); host.afterPreset(); this.refresh(); host.hint("Random: "+FAMILIES[p.family]+" · "+MODES[p.julia===1?0:1],2000); }), this.btn("Same fractal, new look",()=>{ p.randomize(true); host.afterPreset(); this.refresh(); }), this.btn("Mutate",()=>{ p.mutate(); host.afterPreset(); this.refresh(); })));
    c.appendChild(this.btnRow(this.btn("Reset view",()=>{ p.resetView(); this.refresh(); }), this.btn("Reset everything",()=>{ p.resetAll(); host.afterPreset(); this.refresh(); },true)));
    c.appendChild(this.el_("div","sec","Your presets (saved in this browser)"));
    const names=host.userPresetNames();
    if(!names.length) c.appendChild(this.el_("div","note","None saved yet."));
    for(const n of names) c.appendChild(this.btnRow(this.btn(n,()=>{ host.loadUserPreset(n); this.refresh(); }), this.btn("Delete",()=>{ if(confirm('Delete "'+n+'"?')){ host.deleteUserPreset(n); this.rebuild(); } },true)));
    c.appendChild(this.btnRow(this.btn("Save current as…",()=>{ const n=prompt("Preset name"); if(n&&n.trim()){ host.saveUserPreset(n.trim()); this.rebuild(); } })));
    c.appendChild(this.el_("div","sec","Share"));
    c.appendChild(this.btnRow(this.btn("Copy link to this look",()=>host.copyLink()), this.btn("Copy settings (JSON)",()=>host.copyJson()), this.btn("Paste settings",()=>host.pasteJson())));
    c.appendChild(this.el_("div","note","Settings JSON is interchangeable with the Android app's Copy/Paste settings."));
    c.appendChild(this.el_("div","sec","Android app"));
    const a=this.el_("a","btn","⬇ Download "+APK_LABEL); a.href=APK_URL; a.setAttribute("download","");
    const d=this.el_("a","btn","Docs & source"); d.href=DOCS_URL; d.target="_blank"; d.rel="noopener";
    c.appendChild(this.btnRow(a,d));
    c.appendChild(this.el_("div","note","The APK is the full app: it listens to whatever the phone is playing (no microphone needed) and renders at native speed. Sideload: open the APK and allow installs from your browser."));
  }
}

// ============================================================ app
(function main(){
  const canvas=document.getElementById("gl");
  const params=new Params();
  const audio=new AudioIn();
  const hintEl=document.getElementById("hint"); let hintTimer=0;
  const hint=(t,ms=2000)=>{ hintEl.textContent=t; hintEl.classList.remove("hidden"); clearTimeout(hintTimer); hintTimer=setTimeout(()=>hintEl.classList.add("hidden"),ms); };
  // load state: URL hash > localStorage > first preset
  let loaded=false;
  try{ const m=location.hash.match(/p=([^&]+)/); if(m){ params.fromJson(JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))))); loaded=true; } }catch(e){}
  if(!loaded){ try{ const js=localStorage.getItem("fs.current"); if(js){ params.fromJson(JSON.parse(js)); loaded=true; } }catch(e){} }
  if(!loaded) applyPreset(0,params);
  params.audioOn=false;
  const renderer=new Renderer(canvas,params,audio);
  if(!renderer.gl){ document.getElementById("nogl").style.display="flex"; return; }
  try{ const s=parseFloat(localStorage.getItem("fs.scale")); if(s>0) renderer.scale=clamp(s,.3,1); }catch(e){}
  const fixed=params.renderScaleFor(); if(fixed>0) renderer.scale=fixed;

  const host={
    statusLine(){ const a=params.audioOn?this.audioStatus():"audio off"; return FAMILIES[params.family]+" · "+MODES[params.julia===1?0:1]+" · "+Math.round(renderer.fps)+" fps @ "+Math.round(renderer.scale*100)+"% · "+a; },
    audioStatus(){ if(!params.audioOn) return "Off"; if(audio.err) return audio.err; if(!audio.running) return "Starting…"; const now=performance.now()/1000; if(now-audio.lastSound>1.5) return "Listening ("+(audio.kind==="tab"?"tab":"mic")+") · play something"; return "Listening ("+(audio.kind==="tab"?"tab":"mic")+") · level "+Math.round(audio.level*100)+"% · bass "+Math.round(audio.bass*100)+"% · beats "+audio.beatCount; },
    async startAudio(kind){ params.audioOn=true; await audio.start(kind); if(audio.err){ params.audioOn=false; hint(audio.err,3500); } panel.tick(); },
    stopAudio(){ audio.stop(); params.audioOn=false; panel.tick(); },
    afterPreset(){ renderer.clearHistory(); },
    onChange(pr){ if(pr.key==="quality"){ const f=params.renderScaleFor(); if(f>0) renderer.setScale(f); } },
    hint,
    userPresetNames(){ return Object.keys(this.userPresets()).sort(); },
    userPresets(){ try{ return JSON.parse(localStorage.getItem("fs.userPresets")||"{}"); }catch(e){ return {}; } },
    saveUserPreset(n){ const o=this.userPresets(); o[n]=params.toJson(); localStorage.setItem("fs.userPresets",JSON.stringify(o)); hint('Saved "'+n+'"'); },
    loadUserPreset(n){ const o=this.userPresets()[n]; if(o){ params.fromJson(o); renderer.clearHistory(); hint('Loaded "'+n+'"'); } },
    deleteUserPreset(n){ const o=this.userPresets(); delete o[n]; localStorage.setItem("fs.userPresets",JSON.stringify(o)); },
    link(){ const js=JSON.stringify(params.toJson()); const b=btoa(unescape(encodeURIComponent(js))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); return location.origin+location.pathname+"#p="+b; },
    async copyLink(){ const l=this.link(); history.replaceState(null,"","#p="+l.split("#p=")[1]); try{ await navigator.clipboard.writeText(l); hint("Link copied — it recreates this exact look"); }catch(e){ prompt("Copy this link:",l); } },
    async copyJson(){ try{ await navigator.clipboard.writeText(JSON.stringify(params.toJson())); hint("Settings copied to the clipboard"); }catch(e){ prompt("Copy these settings:",JSON.stringify(params.toJson())); } },
    async pasteJson(){ let t=null; try{ t=await navigator.clipboard.readText(); }catch(e){} if(!t) t=prompt("Paste fractalSwing settings JSON:"); if(!t) return; try{ const o=JSON.parse(t); if(!o.swings) throw 0; params.fromJson(o); renderer.clearHistory(); panel.refresh(); hint("Settings pasted"); }catch(e){ hint("That isn't a fractalSwing preset",2500); } }
  };
  const panel=new Panel(params,host);
  const showPanel=localStorage.getItem("fs.panel"); panel.show(showPanel===null?true:showPanel==="1");
  document.getElementById("fab").onclick=()=>panel.show(!panel.visible);
  document.getElementById("bHide").onclick=()=>panel.show(false);
  document.getElementById("bRand").onclick=()=>{ params.randomize(); renderer.clearHistory(); panel.refresh(); hint("Random: "+FAMILIES[params.family]+" · "+MODES[params.julia===1?0:1]); };
  document.getElementById("bFull").onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); };
  const snapshot=()=>{ renderer.shotCb=b=>{ if(!b){ hint("Snapshot failed"); return; } const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="fractalSwing-"+new Date().toISOString().replace(/[:.]/g,"-").slice(0,19)+".png"; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); hint("Snapshot saved"); }; };
  document.getElementById("bSnap").onclick=snapshot;
  if(!localStorage.getItem("fs.seenHint")){ hint("Drag to pan · pinch or wheel to zoom · twist to rotate · tap to hide/show controls · hold or R for a random look",6500); localStorage.setItem("fs.seenHint","1"); }

  // ---- gestures
  const ptrs=new Map(); let downT=0, downX=0, downY=0, moved=false, lastTap=0, longTimer=0, pinchD=0, pinchA=0;
  const wrapAngle=a=>{ while(a>Math.PI) a-=2*Math.PI; while(a<-Math.PI) a+=2*Math.PI; return a; };
  const pan=(dx,dy)=>{ const scale=1.5*Math.pow(2,-params.zoom.value), upp=2*scale/canvas.clientHeight, vx=dx*upp, vy=-dy*upp, r=params.rot.value+params.spin*renderer.animT*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
    params.panX.center=clamp(params.panX.center-(vx*c-vy*s),params.panX.min,params.panX.max); params.panY.center=clamp(params.panY.center-(vx*s+vy*c),params.panY.min,params.panY.max); params.panX.drift=0; params.panY.drift=0; };
  const two=()=>{ const a=[...ptrs.values()]; return {d:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y), ang:Math.atan2(a[1].y-a[0].y,a[1].x-a[0].x)}; };
  canvas.addEventListener("pointerdown",e=>{ canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){ downT=performance.now(); downX=e.clientX; downY=e.clientY; moved=false; clearTimeout(longTimer); longTimer=setTimeout(()=>{ if(!moved&&ptrs.size===1){ moved=true; params.randomize(); renderer.clearHistory(); panel.refresh(); hint("Random: "+FAMILIES[params.family]+" · "+MODES[params.julia===1?0:1]); } },600); }
    else if(ptrs.size===2){ clearTimeout(longTimer); moved=true; const t=two(); pinchD=t.d; pinchA=t.ang; } });
  canvas.addEventListener("pointermove",e=>{ const pt=ptrs.get(e.pointerId); if(!pt) return; const dx=e.clientX-pt.x, dy=e.clientY-pt.y; pt.x=e.clientX; pt.y=e.clientY;
    if(ptrs.size===1){ if(!moved&&Math.hypot(e.clientX-downX,e.clientY-downY)>8){ moved=true; clearTimeout(longTimer); } if(moved) pan(dx,dy); }
    else if(ptrs.size===2){ const t=two(); if(pinchD>0){ params.zoom.center=clamp(params.zoom.center+Math.log2(t.d/pinchD),params.zoom.min,params.zoom.max); params.zoom.drift=0; } let da=t.ang-pinchA; if(da>Math.PI) da-=2*Math.PI; if(da<-Math.PI) da+=2*Math.PI; params.rot.center=wrapAngle(params.rot.center-da); params.rot.drift=0; pinchD=t.d; pinchA=t.ang; } });
  const up=e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); clearTimeout(longTimer);
    if(ptrs.size===0&&!moved&&performance.now()-downT<350){ const now=performance.now(); if(now-lastTap<320){ params.resetView(); panel.refresh(); hint("View reset",1200); lastTap=0; } else { lastTap=now; setTimeout(()=>{ if(lastTap===now){ panel.show(!panel.visible); } },330); } }
    if(ptrs.size===1){ const a=[...ptrs.values()][0]; downX=a.x; downY=a.y; moved=true; } };
  canvas.addEventListener("pointerup",up); canvas.addEventListener("pointercancel",up);
  canvas.addEventListener("wheel",e=>{ e.preventDefault(); params.zoom.center=clamp(params.zoom.center-e.deltaY*.0015,params.zoom.min,params.zoom.max); params.zoom.drift=0; },{passive:false});
  window.addEventListener("keydown",e=>{ if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")) return; const k=e.key.toLowerCase();
    if(k==="h") panel.show(!panel.visible); else if(k==="r") document.getElementById("bRand").click(); else if(k==="s") snapshot(); else if(k==="f") document.getElementById("bFull").click(); else if(k===" "){ params.paused=!params.paused; panel.refresh(); hint(params.paused?"Swings frozen":"Swings running",1000); e.preventDefault(); } else if(k==="escape") panel.show(false); });

  // ---- loop + persistence
  let lastTick=0, lastSave=0;
  function loop(t){ renderer.frame(t); if(t-lastTick>250){ lastTick=t; if(panel.visible) panel.tick(); if(renderer.err&&t-lastErr>8000){ lastErr=t; hint("GL: "+renderer.err,6000); } } if(t-lastSave>5000){ lastSave=t; save(); } requestAnimationFrame(loop); }
  let lastErr=0;
  function save(){ try{ localStorage.setItem("fs.current",JSON.stringify(params.toJson())); localStorage.setItem("fs.scale",String(renderer.scale)); }catch(e){} }
  window.addEventListener("pagehide",save); document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); });
  window.addEventListener("resize",()=>renderer.resize());
  requestAnimationFrame(loop);
})();
</script>
